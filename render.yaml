services:
  - type: web
    name: aidbot-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openrouter:meta-llama/llama-3.1-8b-instruct
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: VECTOR_DB_PATH
        value: /var/data/chroma
      - key: CONVERSATION_STORE_PATH
        value: /var/data/conversations.json
      - key: AUTH_USERS_PATH
        value: /var/data/users.json
      - key: AUTH_SESSIONS_PATH
        value: /var/data/sessions.json
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app
    disk:
      name: aidbot-data
      mountPath: /var/data
      sizeGB: 2
